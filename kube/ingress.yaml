apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minikube-ingress
  annotations:
spec:
  rules:
  - host: kubefastapiapp.test
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kubefastapiapp
            port:
              number: 80