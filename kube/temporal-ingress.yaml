# Exposes the Temporal Web UI only (port 8233).
# The gRPC frontend (7233) cannot use HTTP Ingress — use kubectl port-forward for local access:
#   kubectl port-forward svc/temporal 7233:7233
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temporal-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: temporal.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: temporal
                port:
                  number: 8233
