apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapppkg.temporal.fullname" . }}
  labels:
    {{- include "fastapppkg.labels" . | nindent 4 }}
    app: {{ include "fastapppkg.temporal.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "fastapppkg.temporal.fullname" . }}
  ports:
    - name: grpc
      port: {{ .Values.temporal.service.grpcPort }}
      targetPort: {{ .Values.temporal.service.grpcPort }}
    - name: ui
      port: {{ .Values.temporal.service.uiPort }}
      targetPort: 8080
