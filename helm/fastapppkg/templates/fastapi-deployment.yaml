apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastapppkg.fastapi.fullname" . }}
  labels:
    {{- include "fastapppkg.labels" . | nindent 4 }}
    app: {{ include "fastapppkg.fastapi.fullname" . }}
spec:
  replicas: {{ .Values.fastapi.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "fastapppkg.fastapi.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "fastapppkg.fastapi.fullname" . }}
    spec:
      containers:
        - name: fastapi
          image: "{{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}"
          imagePullPolicy: {{ .Values.fastapi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.fastapi.service.port }}
          env:
            - name: TEMPORAL_HOST
              value: "{{ include "fastapppkg.temporal.fullname" . }}:7233"
            {{- if .Values.fastapi.env }}
            {{- range .Values.fastapi.env }}
            {{- if ne .name "TEMPORAL_HOST" }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
