apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastapppkg.postgres.fullname" . }}-credentials
  labels:
    {{- include "fastapppkg.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.auth.username }}
  password: {{ .Values.postgres.auth.password }}
  database: {{ .Values.postgres.auth.database }}
